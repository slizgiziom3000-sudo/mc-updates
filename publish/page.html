<script>
const b64u={enc:b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),dec:s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))};
const ECP={name:'ECDSA',namedCurve:'P-256'},ECS={name:'ECDSA',hash:'SHA-256'};
const normDev=x=>String(x||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
async function devHash(id){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(normDev(id)))).slice(0,8)}
async function openKey(str,pub,dev){
  const s=String(str).replace(/\s+/g,'').replace(/^MCK-/,'');let d;
  try{d=b64u.dec(s)}catch(e){throw Error('Invalid key')}
  if(d.length!==92)throw Error('Invalid key');
  const pk=await crypto.subtle.importKey('raw',b64u.dec(pub),ECP,false,['verify']);
  if(!await crypto.subtle.verify(ECS,pk,d.slice(28),d.slice(0,28)))throw Error('Invalid key');
  const exp=new DataView(d.buffer).getUint32(0)*1000;
  if(exp<=Date.now())throw Error('This key has expired');
  const bound=d.slice(20,28).some(x=>x!==0);
  if(bound){const h=await devHash(dev);if(!h.every((x,i)=>x===d[20+i]))throw Error('This key is locked to another device')}
  return {exp,contentKey:d.slice(4,20)};
}
async function makeKey(priv,contentKey,hours,dev){
  const p=new Uint8Array(28),exp=Math.floor(Date.now()/1000+hours*3600);
  new DataView(p.buffer).setUint32(0,exp);p.set(contentKey,4);if(normDev(dev))p.set(await devHash(dev),20);
  const sig=new Uint8Array(await crypto.subtle.sign(ECS,priv,p)),o=new Uint8Array(92);
  o.set(p);o.set(sig,28);return {key:'MCK-'+b64u.enc(o),exp:exp*1000};
}
async function adminUnlock(pass,B){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass.trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64u.dec(B.salt),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  let pt;try{pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u.dec(B.iv)},k,b64u.dec(B.ct)))}catch(e){throw Error('Wrong admin key')}
  return {contentKey:pt.slice(0,16),priv:await crypto.subtle.importKey('pkcs8',pt.slice(16),ECP,false,['sign'])};
}
async function decryptPage(blob,contentKey){
  const d=b64u.dec(blob),k=await crypto.subtle.importKey('raw',contentKey,'AES-GCM',false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},k,d.slice(12)));
}

async function go(v){const r=await openKey(v,PUB,devId());const h=await decryptPage(BLOB,r.contentKey);try{localStorage.setItem('mck',v)}catch(e){}
 setTimeout(()=>{try{localStorage.removeItem('mck')}catch(e){}location.reload()},Math.min(r.exp-Date.now(),2147483000));
 document.open();document.write(h);document.close();badge(r.exp);}
function badge(exp){const d=document.createElement('div');d.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99999;background:#0a0a0aee;color:#fff;border:1px solid #2a2a2a;border-radius:999px;padding:8px 14px;font:13px system-ui;pointer-events:none';document.body.appendChild(d);
 const t=()=>{let s=Math.max(0,Math.floor((exp-Date.now())/1000));const D=Math.floor(s/86400),H=Math.floor(s%86400/3600),M=Math.floor(s%3600/60),S=s%60;d.textContent='Key time left: '+(D?D+'d ':'')+(D||H?H+'h ':'')+M+'m '+S+'s'};t();setInterval(t,1000)}
f.onsubmit=async e=>{e.preventDefault();m.textContent='Checking…';try{await go(k.value)}catch(x){m.textContent=(x&&x.message)?x.message:'Invalid key'}};
(async()=>{if(!window.crypto||!crypto.subtle){m.textContent='Open this file in a modern browser (https or local file).';return}dev.textContent=devId();try{const v=localStorage.getItem('mck');if(v)await go(v)}catch(e){try{localStorage.removeItem('mck')}catch(x){}}})();
</script></body></html>
